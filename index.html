<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxia - Agujero Negro</title>
<style>
* {
  margin: 0;
  padding: 0;
}
html, body {
  overflow: hidden;
  background: #000;
}
.webgl {
  position: fixed;
  top: 0;
  left: 0;
  outline: none;
}
#hud {
  position: fixed;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 10;
  pointer-events: none;
  font-family: Arial, sans-serif;
}
#counter {
  background: rgba(40, 0, 50, 0.55);
  border: 2px solid #ff6fb5;
  border-radius: 999px;
  padding: 7px 16px;
  color: #ffd6ea;
  font-size: 15px;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
  transition: transform 0.25s ease;
}
#counter.pop {
  transform: scale(1.16);
}
#musicBtn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid #ff6fb5;
  background: rgba(40, 0, 50, 0.55);
  color: #ffd6ea;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  pointer-events: auto;
  backdrop-filter: blur(4px);
}
#musicBtn.on {
  background: rgba(255, 79, 139, 0.45);
  box-shadow: 0 0 18px rgba(255, 79, 139, 0.6);
}
</style>
</head>
<body>
<canvas class="webgl"></canvas>

<div id="hud">
  <div id="counter">💖 0 / 10</div>
  <button id="musicBtn" aria-label="Musica">♪</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.132.2",
    "three/addons/": "https://esm.sh/three@0.132.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const canvas = document.querySelector('canvas.webgl');
const scene = new THREE.Scene();

// -------------------------------------------------------------
// 1. GALAXIA ESPIRAL PRINCIPAL
// -------------------------------------------------------------
const parameters = {};
parameters.count = 100000;
parameters.size = 0.01;
parameters.radius = 2.15;
parameters.branches = 3;
parameters.spin = 3;
parameters.randomness = 5;
parameters.randomnessPower = 4;
parameters.insideColor = '#ffb3d9';
parameters.outsideColor = '#8a2be2';

const galaxyMaterial = new THREE.PointsMaterial({
  size: parameters.size,
  sizeAttenuation: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true
});

const galaxyGeometry = new THREE.BufferGeometry();
const galaxyPositions = new Float32Array(parameters.count * 3);
const galaxyColors = new Float32Array(parameters.count * 3);

const colorInside = new THREE.Color(parameters.insideColor);
const colorOutside = new THREE.Color(parameters.outsideColor);

for (let i = 0; i < parameters.count; i++) {
  const i3 = i * 3;
  const radius = Math.pow(Math.random() * parameters.randomness, Math.random() * parameters.radius);
  const spinAngle = radius * parameters.spin;
  const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;

  const negPos = [1, -1];
  const randomX = Math.pow(Math.random(), parameters.randomnessPower) * negPos[Math.floor(Math.random() * negPos.length)];
  const randomY = Math.pow(Math.random(), parameters.randomnessPower) * negPos[Math.floor(Math.random() * negPos.length)];
  const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * negPos[Math.floor(Math.random() * negPos.length)];

  galaxyPositions[i3] = Math.cos(branchAngle + spinAngle) * (radius) + randomX;
  galaxyPositions[i3 + 1] = randomY;
  galaxyPositions[i3 + 2] = Math.sin(branchAngle + spinAngle) * (radius) + randomZ;

  const mixedColor = colorInside.clone();
  mixedColor.lerp(colorOutside, Math.random() * radius / parameters.radius);

  galaxyColors[i3] = mixedColor.r;
  galaxyColors[i3 + 1] = mixedColor.g;
  galaxyColors[i3 + 2] = mixedColor.b;
}

galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

const galaxy = new THREE.Points(galaxyGeometry, galaxyMaterial);
scene.add(galaxy);

// -------------------------------------------------------------
// 2. AGUJERO NEGRO EN EL CENTRO DEL ESPIRAL
// -------------------------------------------------------------
function createGlowTexture() {
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 256;
  glowCanvas.height = 256;
  const ctx = glowCanvas.getContext('2d');

  const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0.00, 'rgba(255, 200, 255, 0.55)');
  grad.addColorStop(0.22, 'rgba(200, 90, 255, 0.28)');
  grad.addColorStop(0.55, 'rgba(90, 20, 160, 0.10)');
  grad.addColorStop(1.00, 'rgba(0, 0, 0, 0)');

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);

  return new THREE.CanvasTexture(glowCanvas);
}

const blackHoleGroup = new THREE.Group();

// Brillo / halo del agujero negro
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: createGlowTexture(),
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false
}));
glowSprite.scale.set(4.2, 4.2, 1);
blackHoleGroup.add(glowSprite);

// Bola negra (el agujero en sí)
const blackHoleCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.64, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
blackHoleGroup.add(blackHoleCore);

scene.add(blackHoleGroup);

// Disco de acreción girando alrededor de la bola negra
const diskCount = 9000;
const diskGeometry = new THREE.BufferGeometry();
const diskPositions = new Float32Array(diskCount * 3);
const diskColors = new Float32Array(diskCount * 3);

for (let i = 0; i < diskCount; i++) {
  const i3 = i * 3;
  const r = 0.72 + Math.pow(Math.random(), 0.7) * 1.24;
  const angle = Math.random() * Math.PI * 2;
  const radiusFactor = (r - 0.72) / 1.24;

  diskPositions[i3] = Math.cos(angle) * r;
  diskPositions[i3 + 1] = (Math.random() - 0.5) * (0.04 + radiusFactor * 0.1);
  diskPositions[i3 + 2] = Math.sin(angle) * r;

  const diskColor = new THREE.Color();
  diskColor.setHSL(
    0.62 + radiusFactor * 0.22,
    0.95,
    0.85 - radiusFactor * 0.35
  );
  diskColors[i3] = diskColor.r;
  diskColors[i3 + 1] = diskColor.g;
  diskColors[i3 + 2] = diskColor.b;
}

diskGeometry.setAttribute('position', new THREE.BufferAttribute(diskPositions, 3));
diskGeometry.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));

const diskMaterial = new THREE.PointsMaterial({
  size: 0.007,
  sizeAttenuation: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  transparent: true,
  opacity: 0.9
});

const accretionDisk = new THREE.Points(diskGeometry, diskMaterial);
// Anillo acostado, en el mismo plano que la galaxia
accretionDisk.rotation.x = 0;
scene.add(accretionDisk);

// -------------------------------------------------------------
// 2.1 CORAZONES QUE LATEN ALREDEDOR DEL AGUJERO NEGRO
// -------------------------------------------------------------
function createHeartTexture() {
  const heartCanvas = document.createElement('canvas');
  heartCanvas.width = 128;
  heartCanvas.height = 128;
  const ctx = heartCanvas.getContext('2d');

  ctx.translate(64, 62);
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const t = (i / 120) * Math.PI * 2;
    const hx = 16 * Math.pow(Math.sin(t), 3) * 2.6;
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 2.6;
    if (i === 0) {
      ctx.moveTo(hx, hy);
    } else {
      ctx.lineTo(hx, hy);
    }
  }
  ctx.closePath();
  ctx.fillStyle = '#ff5c9e';
  ctx.shadowColor = '#ff2d78';
  ctx.shadowBlur = 14;
  ctx.fill();
  ctx.shadowBlur = 0;

  return new THREE.CanvasTexture(heartCanvas);
}

const heartTexture = createHeartTexture();

const orbitHeartCount = 220;
const orbitHeartGeometry = new THREE.BufferGeometry();
const orbitHeartPositions = new Float32Array(orbitHeartCount * 3);

for (let i = 0; i < orbitHeartCount; i++) {
  const i3 = i * 3;
  const r = 0.85 + Math.random() * 0.55;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);

  orbitHeartPositions[i3] = r * Math.sin(phi) * Math.cos(theta);
  orbitHeartPositions[i3 + 1] = r * Math.cos(phi) * 0.6;
  orbitHeartPositions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}

orbitHeartGeometry.setAttribute('position', new THREE.BufferAttribute(orbitHeartPositions, 3));

const orbitHeartMaterial = new THREE.PointsMaterial({
  size: 0.075,
  map: heartTexture,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  color: 0xff8fc4,
  opacity: 0.85,
  sizeAttenuation: true
});

const orbitHearts = new THREE.Points(orbitHeartGeometry, orbitHeartMaterial);
scene.add(orbitHearts);

// -------------------------------------------------------------
// 3. ANILLO SECUNDARIO DE POLVO ESTELAR
// -------------------------------------------------------------
const ringCount = 20000;
const ringGeometry = new THREE.BufferGeometry();
const ringPositions = new Float32Array(ringCount * 3);
const ringColors = new Float32Array(ringCount * 3);

for (let i = 0; i < ringCount; i++) {
  const i3 = i * 3;
  const radius = 2.0 + Math.random() * 1.5;
  const angle = Math.random() * Math.PI * 2;

  ringPositions[i3] = Math.cos(angle) * radius;
  ringPositions[i3 + 1] = (Math.random() - 0.5) * 0.2;
  ringPositions[i3 + 2] = Math.sin(angle) * radius;

  const ringColor = new THREE.Color();
  ringColor.setHSL(0.75 + Math.random() * 0.15, 0.8, 0.6);
  ringColors[i3] = ringColor.r;
  ringColors[i3 + 1] = ringColor.g;
  ringColors[i3 + 2] = ringColor.b;
}

ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

const ringMaterial = new THREE.PointsMaterial({
  size: 0.008,
  sizeAttenuation: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  transparent: true,
  opacity: 0.6
});

const starRing = new THREE.Points(ringGeometry, ringMaterial);
scene.add(starRing);

// -------------------------------------------------------------
// 4. LLUVIA DE ESTRELLAS FUGACES
// -------------------------------------------------------------
const shootingStarsCount = 25;
const shootingStarsGeo = new THREE.BufferGeometry();
const shootingStarsPos = new Float32Array(shootingStarsCount * 3);
const shootingStarsVel = [];

for (let i = 0; i < shootingStarsCount; i++) {
  const i3 = i * 3;
  shootingStarsPos[i3] = (Math.random() - 0.5) * 8;
  shootingStarsPos[i3 + 1] = 2 + Math.random() * 3;
  shootingStarsPos[i3 + 2] = (Math.random() - 0.5) * 8;

  shootingStarsVel.push({
    x: -0.03 - Math.random() * 0.04,
    y: -0.02 - Math.random() * 0.03,
    z: (Math.random() - 0.5) * 0.02
  });
}

shootingStarsGeo.setAttribute('position', new THREE.BufferAttribute(shootingStarsPos, 3));
const shootingStarsMat = new THREE.PointsMaterial({
  size: 0.03,
  sizeAttenuation: true,
  color: '#ffffff',
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});

const shootingStars = new THREE.Points(shootingStarsGeo, shootingStarsMat);
scene.add(shootingStars);

function drawRoundedRect(ctx, x, y, w, h, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function createNoteTexture(text) {
  const noteCanvas = document.createElement('canvas');
  noteCanvas.width = 512;
  noteCanvas.height = 300;
  const ctx = noteCanvas.getContext('2d');

  drawRoundedRect(ctx, 6, 6, 500, 288, 34);
  ctx.fillStyle = 'rgba(28, 0, 38, 0.88)';
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#ff6fb5';
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ff4d8d';
  ctx.font = 'bold 42px Arial';
  ctx.fillText('♥', 256, 62);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 30px Arial';

  const maxWidth = 430;
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
      lines.push(line.trim());
      line = words[i] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());

  const lineHeight = 46;
  const startY = 62 + 60 - ((lines.length - 1) * lineHeight) / 2;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], 256, startY + i * lineHeight);
  }

  return new THREE.CanvasTexture(noteCanvas);
}

let focusedSticker = null;

PHOTOS.forEach((photo, index) => {
  const texture = new THREE.TextureLoader().load(photo.src);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  const maxSize = 0.6;
  const aspect = photo.w / photo.h;
  const planeWidth = aspect >= 1 ? maxSize : maxSize * aspect;
  const planeHeight = aspect >= 1 ? maxSize / aspect : maxSize;

  const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  const sticker = new THREE.Mesh(geometry, material);

  // Lejos del agujero negro y separados entre si
  const radius = 1.45 + (index / PHOTOS.length) * 1.15;
  const branchAngle = ((index % 3) / 3) * Math.PI * 2;
  const baseAngle = branchAngle + radius * parameters.spin + (Math.random() - 0.5) * 0.18;

  const noteSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: createNoteTexture(loveNotes[index % loveNotes.length]),
    transparent: true,
    depthWrite: false,
    opacity: 0
  }));
  noteSprite.scale.set(1.0, 0.586, 1);
  noteSprite.visible = false;
  scene.add(noteSprite);

  sticker.userData = {
    index: index,
    radius: radius,
    baseAngle: baseAngle,
    baseY: (Math.random() - 0.5) * 0.5,
    phase: Math.random() * Math.PI * 2,
    noteSprite: noteSprite,
    focus: 0
  };

  scene.add(sticker);
  stickerMeshes.push(sticker);
});

  pointersDown++;
  if (pointersDown === 1) {
    tapStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
  } else {
    tapStart = null; // dos dedos = pellizco, no es un toque
  }
});

canvas.addEventListener('pointerup', (event) => {
  pointersDown = Math.max(0, pointersDown - 1);

  if (!tapStart || tapStart.id !== event.pointerId) {
    if (pointersDown === 0) tapStart = null;
    return;
  }

  const moved = Math.hypot(event.clientX - tapStart.x, event.clientY - tapStart.y);
  tapStart = null;

  if (moved > 12) return; // fue un arrastre, no un toque

  stickerPointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  stickerPointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
  stickerRaycaster.setFromCamera(stickerPointer, camera);

  const hits = stickerRaycaster.intersectObjects(stickerMeshes, false);

  if (hits.length > 0) {
    const sticker = hits[0].object;
    const wasFocused = sticker === focusedSticker;

    loveHeartVisible = false;
    focusedSticker = wasFocused ? null : sticker;

    if (!wasFocused) {
      registerOpening(sticker);

      const stickerPosition = new THREE.Vector3();
      sticker.getWorldPosition(stickerPosition);
      spawnHearts(stickerPosition, 26, 0.9);
    }
    return;
  }

  // ¿tocaste el agujero negro?
  const holeHits = stickerRaycaster.intersectObject(blackHoleCore, false);
  if (holeHits.length > 0) {
    focusedSticker = null;
    showLoveHeart(!loveHeartVisible);
    return;
  }

  // tocar el fondo cierra todo
  focusedSticker = null;
  loveHeartVisible = false;
});

canvas.addEventListener('pointercancel', () => {
  pointersDown = 0;
  tapStart = null;
});

// -------------------------------------------------------------
// 5.1 CHISPAS DE CORAZONES AL TOCAR
// -------------------------------------------------------------
const BURST_MAX = 700;
const burstGeometry = new THREE.BufferGeometry();
const burstPositions = new Float32Array(BURST_MAX * 3);
const burstColors = new Float32Array(BURST_MAX * 3);
const burstVelocities = new Float32Array(BURST_MAX * 3);
const burstLife = new Float32Array(BURST_MAX);
let burstCursor = 0;

for (let i = 0; i < BURST_MAX; i++) {
  burstPositions[i * 3 + 1] = 9999;
}

burstGeometry.setAttribute('position', new THREE.BufferAttribute(burstPositions, 3));
burstGeometry.setAttribute('color', new THREE.BufferAttribute(burstColors, 3));

const burstMaterial = new THREE.PointsMaterial({
  size: 0.07,
  map: heartTexture,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  sizeAttenuation: true
});

const burstPoints = new THREE.Points(burstGeometry, burstMaterial);
burstPoints.frustumCulled = false;
scene.add(burstPoints);

function spawnHearts(origin, count, speed) {
  for (let n = 0; n < count; n++) {
    const i = burstCursor;
    burstCursor = (burstCursor + 1) % BURST_MAX;
    const i3 = i * 3;

    burstPositions[i3] = origin.x;
    burstPositions[i3 + 1] = origin.y;
    burstPositions[i3 + 2] = origin.z;

    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const power = speed * (0.45 + Math.random() * 0.9);

    burstVelocities[i3] = Math.sin(phi) * Math.cos(theta) * power;
    burstVelocities[i3 + 1] = Math.cos(phi) * power + 0.08;
    burstVelocities[i3 + 2] = Math.sin(phi) * Math.sin(theta) * power;

    const color = new THREE.Color();
    color.setHSL(0.9 + Math.random() * 0.08, 0.95, 0.62 + Math.random() * 0.15);
    burstColors[i3] = color.r;
    burstColors[i3 + 1] = color.g;
    burstColors[i3 + 2] = color.b;

    burstLife[i] = 1;
  }
}

// -------------------------------------------------------------
// 5.2 CORAZON GIGANTE + MENSAJE (agujero negro y final)
// -------------------------------------------------------------
function createMessageTexture(lines) {
  const msgCanvas = document.createElement('canvas');
  msgCanvas.width = 1024;
  msgCanvas.height = 384;
  const ctx = msgCanvas.getContext('2d');

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 62px Arial';
  ctx.shadowColor = 'rgba(255, 45, 120, 0.95)';
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#fff2f8';

  const lineHeight = 76;
  const startY = 192 - ((lines.length - 1) * lineHeight) / 2;

  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], 512, startY + i * lineHeight);
  }

  return new THREE.CanvasTexture(msgCanvas);
}

const LOVE_MESSAGE = ['Mi universo eres tú'];
const FINALE_MESSAGE = ['10 fotos, 10 notas...', 'y mil razones para amarte'];

const loveMessage = new THREE.Sprite(new THREE.SpriteMaterial({
  map: createMessageTexture(LOVE_MESSAGE),
  transparent: true,
  depthWrite: false,
  opacity: 0
}));
loveMessage.scale.set(1.55, 0.58, 1);
loveMessage.visible = false;
scene.add(loveMessage);

const loveHeartCount = 4200;
const loveHeartGeometry = new THREE.BufferGeometry();
const loveHeartPositions = new Float32Array(loveHeartCount * 3);
const loveHeartColors = new Float32Array(loveHeartCount * 3);

for (let i = 0; i < loveHeartCount; i++) {
  const i3 = i * 3;
  const t = Math.random() * Math.PI * 2;
  const fill = Math.pow(Math.random(), 0.35);

  loveHeartPositions[i3] = 16 * Math.pow(Math.sin(t), 3) * 0.03 * fill;
  loveHeartPositions[i3 + 1] = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.03 * fill;
  loveHeartPositions[i3 + 2] = (Math.random() - 0.5) * 0.06;

  const color = new THREE.Color();
  color.setHSL(0.9 + Math.random() * 0.06, 0.95, 0.62 + Math.random() * 0.25);
  loveHeartColors[i3] = color.r;
  loveHeartColors[i3 + 1] = color.g;
  loveHeartColors[i3 + 2] = color.b;
}

loveHeartGeometry.setAttribute('position', new THREE.BufferAttribute(loveHeartPositions, 3));
loveHeartGeometry.setAttribute('color', new THREE.BufferAttribute(loveHeartColors, 3));

const loveHeartMaterial = new THREE.PointsMaterial({
  size: 0.028,
  map: heartTexture,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  opacity: 0,
  sizeAttenuation: true
});

const loveHeartPoints = new THREE.Points(loveHeartGeometry, loveHeartMaterial);
loveHeartPoints.frustumCulled = false;

const loveHeartGroup = new THREE.Group();
loveHeartGroup.add(loveHeartPoints);
loveHeartGroup.visible = false;
scene.add(loveHeartGroup);

let loveHeartVisible = false;
let loveHeartAmount = 0;

function setLoveMessage(lines) {
  loveMessage.material.map = createMessageTexture(lines);
  loveMessage.material.needsUpdate = true;
}

function showLoveHeart(show, lines) {
  loveHeartVisible = show;
  if (lines) setLoveMessage(lines);
  if (show) spawnHearts(new THREE.Vector3(0, 0, 0), 70, 1.3);
}

// -------------------------------------------------------------
// 5.3 CONTADOR Y SORPRESA FINAL
// -------------------------------------------------------------
const counterElement = document.getElementById('counter');
const openedStickers = new Set();
let finaleDone = false;

counterElement.textContent = '💖 0 / ' + PHOTOS.length;

function registerOpening(sticker) {
  const index = sticker.userData.index;
  if (openedStickers.has(index)) return;

  openedStickers.add(index);
  counterElement.textContent = '💖 ' + openedStickers.size + ' / ' + PHOTOS.length;

  counterElement.classList.add('pop');
  setTimeout(() => counterElement.classList.remove('pop'), 260);

  if (openedStickers.size === PHOTOS.length && !finaleDone) {
    finaleDone = true;
    focusedSticker = null;
    setTimeout(() => {
      showLoveHeart(true, FINALE_MESSAGE);
      spawnHearts(new THREE.Vector3(0, 0, 0), 180, 1.9);
    }, 500);
  }
}

// -------------------------------------------------------------
// 5.4 MUSICA ROMANTICA (generada, con boton de play)
// -------------------------------------------------------------
const musicButton = document.getElementById('musicBtn');
let audioCtx = null;
let musicGain = null;
let musicOn = false;
let musicStep = 0;
let nextStepTime = 0;

const chordProgression = [
  [130.81, 164.81, 196.00, 261.63],
  [98.00, 123.47, 146.83, 196.00],
  [110.00, 130.81, 164.81, 220.00],
  [87.31, 110.00, 130.81, 174.61]
];

function playPluck(frequency, time, duration, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.linearRampToValueAtTime(volume, time + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

  osc.connect(gain);
  gain.connect(musicGain);
  osc.start(time);
  osc.stop(time + duration + 0.05);
}

function playPad(frequencies, time, duration) {
  frequencies.forEach((frequency) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = frequency / 2;

    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(0.05, time + 1.1);
    gain.gain.linearRampToValueAtTime(0.0001, time + duration);

    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(time);
    osc.stop(time + duration + 0.1);
  });
}

function scheduleMusic() {
  if (!audioCtx || !musicOn) return;

  while (nextStepTime < audioCtx.currentTime + 0.35) {
    const chord = chordProgression[Math.floor(musicStep / 8) % chordProgression.length];
    const pattern = [0, 1, 2, 3, 2, 1, 2, 3];
    const note = chord[pattern[musicStep % 8]];

    playPluck(note * 2, nextStepTime, 1.4, 0.16);

    if (musicStep % 16 === 0) {
      playPluck(chord[0], nextStepTime, 2.2, 0.1);
    }
    if (musicStep % 8 === 0) {
      playPad(chord, nextStepTime, 3.6);
    }

    nextStepTime += 0.42;
    musicStep++;
  }
}

musicButton.addEventListener('click', () => {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.55;
    musicGain.connect(audioCtx.destination);

    const delay = audioCtx.createDelay(1.0);
    delay.delayTime.value = 0.34;
    const feedback = audioCtx.createGain();
    feedback.gain.value = 0.28;
    const wet = audioCtx.createGain();
    wet.gain.value = 0.35;

    musicGain.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(wet);
    wet.connect(audioCtx.destination);

    nextStepTime = audioCtx.currentTime + 0.1;
    setInterval(scheduleMusic, 100);
  }

  if (musicOn) {
    audioCtx.suspend();
    musicOn = false;
    musicButton.textContent = '♪';
    musicButton.classList.remove('on');
  } else {
    audioCtx.resume();
    if (nextStepTime < audioCtx.currentTime) {
      nextStepTime = audioCtx.currentTime + 0.1;
    }
    musicOn = true;
    musicButton.textContent = '♫';
    musicButton.classList.add('on');
  }
});

// -------------------------------------------------------------
// 6. CÁMARA Y CONTROLES 360 LIBRES
// -------------------------------------------------------------
const sizes = {
  width: window.innerWidth,
  height: window.innerHeight
};

window.addEventListener('resize', () => {
  sizes.width = window.innerWidth;
  sizes.height = window.innerHeight;
  camera.aspect = sizes.width / sizes.height;
  camera.updateProjectionMatrix();
  renderer.setSize(sizes.width, sizes.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
camera.position.x = 0;
camera.position.y = 1.7;
camera.position.z = 3.2;
scene.add(camera);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI;

const renderer = new THREE.WebGLRenderer({ canvas: canvas });
renderer.setSize(sizes.width, sizes.height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const clock = new THREE.Clock();
let lastFrameTime = 0;

const focusDirection = new THREE.Vector3();
const focusPosition = new THREE.Vector3();
const cameraDown = new THREE.Vector3();

const tick = () => {
  const elapsedTime = clock.getElapsedTime();
  const dt = Math.min(elapsedTime - lastFrameTime, 0.05);
  lastFrameTime = elapsedTime;
  controls.update();

  galaxy.rotation.y = elapsedTime * 0.05;
  starRing.rotation.y = -elapsedTime * 0.08;

  // Agujero negro: disco girando y halo que respira
  accretionDisk.rotation.y = elapsedTime * 0.7;
  glowSprite.material.opacity = 0.8 + Math.sin(elapsedTime * 2.0) * 0.15;

  // Stickers girando con el espiral + zoom al tocarlos
  camera.getWorldDirection(focusDirection);
  focusPosition.copy(camera.position).addScaledVector(focusDirection, 1.9);
  cameraDown.set(0, -1, 0).applyQuaternion(camera.quaternion);

  stickerMeshes.forEach((sticker) => {
    const d = sticker.userData;
    const isFocused = sticker === focusedSticker;
    d.focus += ((isFocused ? 1 : 0) - d.focus) * Math.min(1, dt * 7);

    const angle = d.baseAngle - galaxy.rotation.y;
    const orbitX = Math.cos(angle) * d.radius;
    const orbitZ = Math.sin(angle) * d.radius;
    const orbitY = d.baseY + Math.sin(elapsedTime * 1.2 + d.phase) * 0.05;

    sticker.position.set(
      orbitX + (focusPosition.x - orbitX) * d.focus,
      orbitY + (focusPosition.y - orbitY) * d.focus,
      orbitZ + (focusPosition.z - orbitZ) * d.focus
    );

    sticker.lookAt(camera.position);
    sticker.rotateY(d.focus * Math.PI * 2);

    const s = (1 + Math.sin(elapsedTime * 1.5 + d.phase) * 0.04) * (1 + d.focus * 1.05);
    sticker.scale.set(s, s, s);

    const note = d.noteSprite;
    note.visible = d.focus > 0.02;
    note.material.opacity = Math.max(0, d.focus * 1.25 - 0.25);
    note.position.copy(sticker.position).addScaledVector(cameraDown, 0.9);
  });

  // Corazones latiendo alrededor del agujero negro
  orbitHearts.rotation.y = -elapsedTime * 0.25;
  orbitHearts.rotation.x = Math.sin(elapsedTime * 0.35) * 0.18;
  orbitHeartMaterial.size = 0.06 + Math.sin(elapsedTime * 1.8) * 0.015;

  // Chispas de corazones
  let burstNeedsUpdate = false;
  for (let i = 0; i < BURST_MAX; i++) {
    if (burstLife[i] <= 0) continue;

    const i3 = i * 3;
    burstLife[i] -= dt * 0.6;

    if (burstLife[i] <= 0) {
      burstLife[i] = 0;
      burstPositions[i3 + 1] = 9999;
      burstColors[i3] = 0;
      burstColors[i3 + 1] = 0;
      burstColors[i3 + 2] = 0;
      burstNeedsUpdate = true;
      continue;
    }

    burstPositions[i3] += burstVelocities[i3] * dt;
    burstPositions[i3 + 1] += burstVelocities[i3 + 1] * dt;
    burstPositions[i3 + 2] += burstVelocities[i3 + 2] * dt;

    burstVelocities[i3 + 1] -= 0.18 * dt;

    const fade = 1 - dt * 0.55;
    burstColors[i3] *= fade;
    burstColors[i3 + 1] *= fade;
    burstColors[i3 + 2] *= fade;
    burstNeedsUpdate = true;
  }

  if (burstNeedsUpdate) {
    burstGeometry.attributes.position.needsUpdate = true;
    burstGeometry.attributes.color.needsUpdate = true;
  }

  // Corazón gigante frente a la cámara
  loveHeartAmount += ((loveHeartVisible ? 1 : 0) - loveHeartAmount) * Math.min(1, dt * 5);

  loveHeartGroup.visible = loveHeartAmount > 0.01;
  loveMessage.visible = loveHeartAmount > 0.05;

  if (loveHeartGroup.visible) {
    const pulse = 1 + Math.sin(elapsedTime * 3) * 0.05;
    const heartScale = loveHeartAmount * 1.3 * pulse;

    loveHeartGroup.position.copy(camera.position).addScaledVector(focusDirection, 2.4);
    loveHeartGroup.scale.set(heartScale, heartScale, heartScale);
    loveHeartGroup.lookAt(camera.position);
    loveHeartMaterial.opacity = loveHeartAmount;

    loveMessage.position.copy(camera.position)
      .addScaledVector(focusDirection, 2.4)
      .addScaledVector(cameraDown, 1.08);
    loveMessage.material.opacity = Math.max(0, loveHeartAmount * 1.5 - 0.5);
  }

  const ssPosAttr = shootingStarsGeo.attributes.position;
  const ssArr = ssPosAttr.array;
  for (let i = 0; i < shootingStarsCount; i++) {
    const i3 = i * 3;
    ssArr[i3] += shootingStarsVel[i].x;
    ssArr[i3 + 1] += shootingStarsVel[i].y;
    ssArr[i3 + 2] += shootingStarsVel[i].z;

    if (ssArr[i3 + 1] < -3) {
      ssArr[i3] = (Math.random() - 0.5) * 8;
      ssArr[i3 + 1] = 3 + Math.random() * 2;
      ssArr[i3 + 2] = (Math.random() - 0.5) * 8;
    }
  }
  ssPosAttr.needsUpdate = true;

  renderer.render(scene, camera);
  window.requestAnimationFrame(tick);
};

tick();
</script>
